services:
  rusticket:
    container_name: rusticket
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      RUSTPLUS_SNAPSHOT_FILE: /rustplus-inbox/rusticket-snapshot.json
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - rusticket-data:/data
      - rustplus-inbox:/rustplus-inbox:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
  telegram-ticket-bot:
    container_name: telegram-ticket-bot
    build:
      context: ./telegram-ticket-bot
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      RUSTICKET_INTERNAL_URL: http://rusticket:3000
    depends_on:
      rusticket:
        condition: service_healthy
volumes:
  rusticket-data:
    name: rusticket-data
  rustplus-inbox:
    external: true
    name: rustplus-bridge_rustplus-data
